<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC · 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h1>VMIC · 设置</h1>

  <div class="card">
    <div class="label">注入</div>
    <label class="row switch">
      <input type="checkbox" id="enable">
      <span>启用音频独占</span>
    </label>
    <div class="hint">关闭后页面获取真实麦克风</div>
  </div>

  <div class="card">
    <div class="label">播放对齐</div>
    <div class="row">
      <select id="mode">
        <option value="auto">自动 - 网站请求时，录音可及时出声</option>
        <option value="manual">手动 - 只有在插件内点播放按钮才出声</option>
      </select>
    </div>
    <div class="row" id="delayRow">
      <span>自动延时</span>
      <input type="range" id="delay" min="0" max="3000" step="100">
      <span id="delayLabel">800 ms</span>
    </div>
  </div>

  <div class="card">
    <div class="label">输出控制</div>
    <div class="row">
      <span>音量</span>
      <input type="range" id="volume" min="0" max="100" step="5">
      <span id="volLabel">100%</span>
    </div>
    <label class="row switch">
      <input type="checkbox" id="monitor" checked>
      <span>外放试听</span>
    </label>
    <label class="row switch">
      <input type="checkbox" id="loop">
      <span>循环播放</span>
    </label>
  </div>

  <div class="card">
    <div class="label">噪音覆盖</div>
    <label class="row switch">
      <input type="checkbox" id="noiseOn" checked>
      <span>启用噪音覆盖</span>
    </label>
    <label class="row switch">
      <input type="checkbox" id="noiseRandom" checked>
      <span>启用随机噪音</span>
    </label>
    <div class="row">
      <span>选择噪音</span>
      <select id="noiseId">
        <option value="ocean-waves">海浪</option>
        <option value="rain">雨声</option>
        <option value="stream">溪流</option>
        <option value="thunder">雷声</option>
      </select>
    </div>
    <div class="row">
      <span>噪音音量</span>
      <input type="range" id="noiseVol" min="0" max="100" step="5">
      <span id="noiseVolLabel">10%</span>
    </div>
  </div>

  <div id="status" class="status"></div>
  <script src="../lib/common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
