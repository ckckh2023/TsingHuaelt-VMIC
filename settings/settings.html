<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC · 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h1>VMIC · 设置</h1>

  <div class="card">
    <div class="label">注入</div>
    <label class="row switch">
      <input type="checkbox" id="enable">
      <span>启用注入（独占：本站录音只能拿到插件音频）</span>
    </label>
    <div class="hint">默认开启；关闭后页面走真实麦克风，本扩展不生效。设置保存在当次浏览器会话内。</div>
  </div>

  <div class="card">
    <div class="label">播放对齐（处理）</div>
    <div class="row">
      <select id="mode">
        <option value="auto">自动：网站一请求录音就从头播（可按延时对齐）</option>
        <option value="manual">手动：在弹窗里点“播放”再出声</option>
      </select>
    </div>
    <div class="row" id="delayRow">
      <span>自动延时</span>
      <input type="range" id="delay" min="0" max="3000" step="100">
      <span id="delayLabel">800 ms</span>
    </div>
    <div class="hint">延时期间先录静音，到点才开始出声，用于对齐站内倒计时。</div>
  </div>

  <div class="card">
    <div class="label">输出控制</div>
    <div class="row">
      <span>音量</span>
      <input type="range" id="volume" min="0" max="100" step="5">
      <span id="volLabel">100%</span>
    </div>
    <label class="row switch">
      <input type="checkbox" id="monitor" checked>
      <span>外放试听（扬声器能听到正在录的声音）</span>
    </label>
    <label class="row switch">
      <input type="checkbox" id="loop">
      <span>循环播放（直到停止）</span>
    </label>
  </div>

  <div id="status" class="status"></div>
  <div class="foot">改动的设置即时生效，无需保存按钮。</div>
  <script src="settings.js"></script>
</body>
</html>
