<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC · 选择本地音频</title>
  <style>
    body { font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { color: #1a4f8b; font-size: 20px; }
    .card { border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px 20px; background: #fafbfc; margin-top: 12px; }
    .hint { color: #888; font-size: 13px; margin: 8px 0; }
    #status { color: #b4550b; min-height: 20px; margin-top: 8px; }
    #info { color: #1a7f4b; }
  </style>
</head>
<body>
  <h1>VMIC · 选择本地音频（输入源）</h1>
  <p class="hint">
    这是独立的整页设置页，不会被文件选择器抢焦点而关闭。
    选完文件即持久保存，关掉本页、刷新网页都不会丢失；只有在这里重新选择才会更换。
  </p>
  <div class="card">
    <input type="file" id="file" accept="audio/*">
    <div id="info">当前：读取中…</div>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
