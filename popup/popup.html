<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC 控制面板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>清华社英语在线 · VMIC</h1>

  <div id="stateLine" class="stateline">读取中…</div>

  <div class="group">
    <div class="label">播放列表 <span id="listMeta" class="meta"></span></div>
    <ul id="list" class="list"></ul>
    <button id="btnPick" class="primary">＋ 选择文件…</button>
    <div class="hint">在独立整页中添加本地音频（可多选）；点列表行切换“当前文件”——网页录音时拿到的就是它。</div>
  </div>

  <div class="group">
    <div class="label">播放控制</div>
    <div class="row btns">
      <button id="btnPlay" class="primary">播放</button>
      <button id="btnPause" class="primary">暂停</button>
      <button id="btnRestart" class="primary">重播</button>
    </div>
    <div class="hint">“播放”可从扬声器试听当前文件；“自动”模式下网站请求录音会自动从头播放（模式与延时在设置页）。</div>
  </div>

  <div id="status" class="status"></div>

  <div class="foot">
    <a href="#" id="lnkSettings">⚙ 设置</a>
    <span>仅 *.tsinghuaelt.com · Chrome ≥ 111</span>
  </div>
  <script src="../lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
