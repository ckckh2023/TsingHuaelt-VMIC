<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC 控制面板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>清英在线 · VMIC</h1>

  <div id="stateLine" class="stateline">读取中…</div>

  <div class="group">
    <div class="label listhead">播放列表 <span id="listMeta" class="meta"></span>
      <button id="btnClear" class="clear" title="删除全部音频">清空</button>
    </div>
    <ul id="list" class="list"></ul>
    <button id="btnPick" class="primary">＋ 选择文件…</button>
  </div>

  <div class="group">
    <div class="label">播放控制</div>
    <div class="row btns">
      <button id="btnPlay" class="primary">播放</button>
      <button id="btnPause" class="primary">暂停</button>
      <button id="btnRestart" class="primary">重播</button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <div class="foot">
    <a href="#" id="lnkSettings">⚙ 设置</a>

    <a href="#" id="lnkUpdate">检查更新</a>
  </div>
  <script src="../lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
