<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>VMIC · 添加本地音频</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <h1>VMIC · 选择本地音频</h1>
  <div class="card">
    <div class="row">
      <button type="button" id="btnFiles" class="primary">＋ 选择文件…</button>
      <button type="button" id="btnFolder" class="primary">＋ 选择文件夹…</button>
    </div>
    <input type="file" id="file" accept="audio/*" multiple hidden>
    <input type="file" id="folder" webkitdirectory multiple hidden>
    <div id="status" class="status">播放列表已就绪！</div>
  </div>
  <div class="card">
    <div class="label">播放列表 <span id="listMeta" class="meta"></span></div>
    <ul id="list" class="list"></ul>
  </div>
  <script src="../lib/idb.js"></script>
  <script src="../lib/common.js"></script>
  <script src="picker.js"></script>
</body>
</html>
